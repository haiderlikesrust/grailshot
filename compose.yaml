services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grailshot
      POSTGRES_PASSWORD: grailshot_local
      POSTGRES_DB: grailshot
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - grailshot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grailshot"]
      interval: 5s
      retries: 10
volumes:
  grailshot-db:
